<header class="header-interno">

    <div class="container">

        <a href="index.html" class="logo">
            AD <span>Tech</span>
        </a>

    </div>

</header>


<section class="orcamento">
<a href="index.html" class="btn-voltar">
    <i class="fa-solid fa-arrow-left"></i> Voltar para a página inicial
</a>

<div class="container">

<div class="titulo">

<h1>Solicite um orçamento</h1>

<p>

Preencha as informações abaixo.

Nossa equipe entrará em contato o mais breve possível.

</p>

</div>

<form class="form-orcamento">

<div class="campo">

<label>Nome Completo</label>

<input type="text" placeholder="Digite seu nome" required>

</div>

<div class="campo">

<label>Empresa</label>

<input type="text" placeholder="Nome da empresa">

</div>

<div class="campo">

<label>Telefone</label>

<input type="tel" placeholder="(00) 00000-0000" required>

</div>

<div class="campo">

<label>E-mail</label>

<input type="email" placeholder="email@empresa.com" required>

</div>

<div class="campo">

<label>CPF ou CNPJ</label>

<input type="text" placeholder="000.000.000-00">

</div>

<div class="campo">

<label>Serviço desejado</label>

<select required>

<option value="">Selecione</option>

<option>Desenvolvimento de Software</option>

<option>Site Institucional</option>


<option>Infraestrutura de TI</option>

<option>Cloud Computing</option>

<option>Microsoft 365</option>

<option>Consultoria em TI</option>

<option>Suporte Técnico</option>

<option>Segurança da Informação</option>

<option>Outro</option>

</select>

</div>

<div class="campo">

<label>Descreva sua necessidade</label>

<textarea rows="6" placeholder="Conte um pouco sobre o projeto..."></textarea>

</div>

<button type="submit">

Solicitar orçamento

</button>

</form>

</div>

</section>
